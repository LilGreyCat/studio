services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - ${ENV_FILE:-.env.production}
    command:
      - -path
      - /app/migrations
      - -database
      - ${DATABASE_URL:?DATABASE_URL is required}
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - prod_uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin-create:
    profiles: ["tools"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: admin-cli
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  upload-cleanup:
    profiles: ["tools"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: upload-cleaner
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prod_uploads:/app/uploads
    restart: "no"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is required}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  prod_db_data:
  prod_uploads:
